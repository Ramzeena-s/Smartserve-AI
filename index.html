<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartServe AI | Food Waste Dashboard</title>

    <style>
        :root {
            --green: #167653;
            --dark: #153d30;
            --light: #eff7f1;
            --muted: #708078;
            --border: #e1eae4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f8f6;
            color: #20372d;
        }

        header {
            background: linear-gradient(120deg, #124c37, #21845b);
            color: white;
            padding: 24px 6%;
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #a9f0c8;
        }

        .nav-label {
            font-size: 13px;
            color: #d9f4e4;
        }

        .hero {
            max-width: 1200px;
            margin: 30px auto 0;
        }

        .hero h1 {
            font-size: clamp(27px, 4vw, 42px);
            margin: 0 0 10px;
        }

        .hero p {
            margin: 0;
            color: #e0f1e7;
            line-height: 1.6;
            max-width: 650px;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-heading {
            margin: 28px 0 16px;
        }

        .section-heading h2 {
            font-size: 22px;
            margin: 0 0 6px;
        }

        .section-heading p {
            color: var(--muted);
            margin: 0;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .stat,
        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 20px #193c2c06;
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
        }

        .stat-value {
            font-size: 29px;
            font-weight: 800;
            color: var(--dark);
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .stat-note {
            color: var(--muted);
            font-size: 12px;
            margin-top: 8px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
            gap: 20px;
            align-items: start;
        }

        .panel h3 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .panel-description {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d7e2da;
            border-radius: 9px;
            background: white;
            color: #263a30;
            font: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #9edcba;
            border-color: var(--green);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 13px 17px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .primary {
            flex: 1;
            background: var(--green);
            color: white;
        }

        .primary:hover {
            background: #105d40;
        }

        .secondary {
            background: #edf3ef;
            color: #345346;
        }

        .result {
            margin-top: 22px;
            padding: 23px;
            border-radius: 14px;
            background: #eaf7ee;
            border: 1px solid #c9e8d2;
        }

        .result-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .result-title {
            font-size: 14px;
            font-weight: 700;
        }

        .waste-number {
            font-size: clamp(32px, 5vw, 44px);
            color: #146b46;
            font-weight: 800;
            margin: 13px 0 5px;
            overflow-wrap: anywhere;
        }

        .pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .low {
            background: #d8f3df;
            color: #176638;
        }

        .moderate {
            background: #fff0c9;
            color: #805b00;
        }

        .high {
            background: #ffe0dc;
            color: #a32c24;
        }

        .result-note {
            color: #506a5b;
            font-size: 13px;
            line-height: 1.6;
        }

        .tips {
            padding-left: 20px;
            margin: 14px 0 0;
        }

        .tips li {
            margin: 10px 0;
            line-height: 1.5;
            font-size: 14px;
        }

        .error {
            background: #fff0ee;
            border: 1px solid #f0c6c0;
            color: #992c23;
            padding: 14px;
            border-radius: 10px;
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 450px;
        }

        th,
        td {
            text-align: left;
            padding: 14px 10px;
            border-bottom: 1px solid #edf1ee;
            font-size: 13px;
        }

        th {
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 25px 5px;
            font-size: 14px;
        }
